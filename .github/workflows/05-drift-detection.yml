name: 05 - Infrastructure Drift Detection

on:
  # Manual run for demonstrations and controlled experiments
  workflow_dispatch:
    inputs:
      simulate_error:
        description: "Simulate Terraform monitoring failure"
        required: false
        default: false
        type: boolean

  # Automated daily drift check
  # GitHub Actions cron uses UTC
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

# Avoid multiple Terraform monitoring runs using the same state at the same time
concurrency:
  group: koalatech-terraform-state
  cancel-in-progress: false

jobs:
  drift-detection:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: terraform

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Authenticate GitHub Actions to Azure
      # =========================================================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =========================================================
      # 3. Configure Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # =========================================================
      # 4. Initialise remote Azure Blob backend
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false

      # =========================================================
      # 5. Validate Terraform configuration
      # =========================================================
      - name: Terraform Validate
        run: terraform validate

      # =========================================================
      # 6. Controlled monitoring failure experiment
      #
      # Used only when simulate_error = true.
      # The invalid file exists only in the temporary GitHub runner.
      # =========================================================
      - name: Inject Controlled Terraform Error
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_error }}
        run: |
          echo 'this is deliberately invalid terraform {' > simulated-error.tf

      # =========================================================
      # 7. Detect infrastructure drift
      #
      # Exit codes:
      #   0 = configuration matches Azure
      #   1 = Terraform / monitoring error
      #   2 = Terraform has changes to make
      #
      # A clean baseline is established before testing, therefore
      # externally introduced Azure changes are classified as drift.
      # =========================================================
      - name: Detect Infrastructure Drift
        id: drift
        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -input=false \
            -no-color \
            -out=drift.tfplan \
            > drift-plan.txt 2>&1

          EXIT_CODE=$?

          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then

            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "resources=None" >> "$GITHUB_OUTPUT"

            echo "Infrastructure status: HEALTHY"

          elif [ "$EXIT_CODE" -eq 2 ]; then

            echo "status=drift" >> "$GITHUB_OUTPUT"

            # Convert the Terraform plan to JSON so the affected
            # resources can be extracted automatically.
            terraform show -json drift.tfplan > drift-plan.json

            RESOURCES=$(jq -r '
              [
                .resource_changes[]?
                | select(.change.actions != ["no-op"])
                | .address
              ]
              | unique
              | if length == 0
                  then ["See Terraform diagnostic artifact"]
                  else .
                end
              | join(", ")
            ' drift-plan.json)

            echo "resources=$RESOURCES" >> "$GITHUB_OUTPUT"

            echo "Infrastructure status: DRIFT"
            echo "Affected resources: $RESOURCES"

          else

            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "resources=N/A" >> "$GITHUB_OUTPUT"

            echo "Infrastructure monitoring status: ERROR"

          fi

          # Keep this step successful so later steps can generate
          # diagnostics and Teams notifications.
          exit 0

      # =========================================================
      # 8. Remove controlled test file
      # =========================================================
      - name: Cleanup Controlled Error
        if: always()
        run: |
          rm -f simulated-error.tf

      # =========================================================
      # 9. Write useful GitHub Actions summary
      # =========================================================
      - name: Write Monitoring Summary
        if: always()
        run: |
          echo "## KoalaTech Infrastructure Drift Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ steps.drift.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Terraform exit code:** ${{ steps.drift.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Affected resources:** ${{ steps.drift.outputs.resources }}" >> "$GITHUB_STEP_SUMMARY"

      # =========================================================
      # 10. Preserve diagnostics when drift/error occurs
      # =========================================================
      - name: Upload Terraform Diagnostics
        if: ${{ steps.drift.outputs.status != 'healthy' }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-diagnostics
          path: terraform/drift-plan.txt
          retention-days: 7

      # =========================================================
      # 11. Send Microsoft Teams alert for real drift
      # =========================================================
      - name: Send Teams Drift Alert
        if: ${{ steps.drift.outputs.status == 'drift' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DETECTED="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          jq -n \
            --arg resource "${{ steps.drift.outputs.resources }}" \
            --arg detected "$DETECTED" \
            --arg run_url "$RUN_URL" \
            '{
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "size": "Medium",
                  "weight": "Bolder",
                  "text": "⚠️ KoalaTech Infrastructure Drift Detected"
                },
                {
                  "type": "FactSet",
                  "facts": [
                    {
                      "title": "Environment",
                      "value": "Azure"
                    },
                    {
                      "title": "Status",
                      "value": "DRIFT"
                    },
                    {
                      "title": "Affected resource(s)",
                      "value": $resource
                    },
                    {
                      "title": "Detected",
                      "value": $detected
                    }
                  ]
                },
                {
                  "type": "TextBlock",
                  "text": "Review the detected infrastructure change before remediation.",
                  "wrap": true
                },
                {
                  "type": "ActionSet",
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "Open GitHub Actions Run",
                      "url": $run_url
                    }
                  ]
                }
              ]
            }' > teams-card.json

          curl --fail-with-body \
            --retry 3 \
            -X POST \
            -H "Content-Type: application/json" \
            -d @teams-card.json \
            "$TEAMS_WEBHOOK_URL"

      # =========================================================
      # 12. Send separate Teams alert for monitoring failure
      #
      # This is deliberately separate from infrastructure drift.
      # =========================================================
      - name: Send Teams Monitoring Error
        if: ${{ steps.drift.outputs.status == 'error' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DETECTED="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          jq -n \
            --arg exit_code "${{ steps.drift.outputs.exit_code }}" \
            --arg detected "$DETECTED" \
            --arg run_url "$RUN_URL" \
            '{
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.4",
              "body": [
                {
                  "type": "TextBlock",
                  "size": "Medium",
                  "weight": "Bolder",
                  "text": "❌ KoalaTech Drift Monitoring Error"
                },
                {
                  "type": "FactSet",
                  "facts": [
                    {
                      "title": "Status",
                      "value": "MONITORING ERROR"
                    },
                    {
                      "title": "Terraform exit code",
                      "value": $exit_code
                    },
                    {
                      "title": "Detected",
                      "value": $detected
                    }
                  ]
                },
                {
                  "type": "TextBlock",
                  "text": "The monitoring process failed. This result is NOT classified as infrastructure drift.",
                  "wrap": true
                },
                {
                  "type": "ActionSet",
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "Open GitHub Actions Run",
                      "url": $run_url
                    }
                  ]
                }
              ]
            }' > teams-error-card.json

          curl --fail-with-body \
            --retry 3 \
            -X POST \
            -H "Content-Type: application/json" \
            -d @teams-error-card.json \
            "$TEAMS_WEBHOOK_URL"

      # =========================================================
      # 13. Mark monitoring errors as failed only AFTER
      # diagnostics and notification have been generated.
      # =========================================================
      - name: Fail Monitoring Job on Terraform Error
        if: ${{ steps.drift.outputs.status == 'error' }}
        run: |
          echo "Terraform monitoring failed."
          exit 1