name: 03 - Test Staging

on:
  workflow_run:
    workflows:
      - "02 - Deploy to Staging"
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for staging frontend IP
        run: |
          for i in {1..30}; do

            FRONTEND_IP=$(kubectl get service frontend \
              -n staging \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              echo "FRONTEND_IP=$FRONTEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Waiting for staging frontend IP..."

            sleep 10
          done

          echo "Unable to find staging frontend IP."
          exit 1

      - name: Test frontend
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            http://${{ env.FRONTEND_IP }}

      - name: Check monitoring pods
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            -n monitoring \
            --timeout=300s

          kubectl get pods -n monitoring

      - name: Verify Prometheus
        run: |
          kubectl port-forward \
            -n monitoring \
            svc/prometheus-kube-prometheus-prometheus \
            9090:9090 > /tmp/prometheus.log 2>&1 &

          PID=$!
          sleep 10
          curl --fail http://127.0.0.1:9090/-/ready
          kill $PID

      - name: Verify Grafana
        run: |
          kubectl port-forward \
            -n monitoring \
            svc/prometheus-grafana \
            3000:80 > /tmp/grafana.log 2>&1 &

          PID=$!
          sleep 10
          curl --fail http://127.0.0.1:3000/api/health
          kill $PID
